<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
        <h1>List of my favorite items</h1>
    </head>
    <body>
        <script>
            var items = ["cups", "doornobs", "glasses", "USB", "SD cards", "Usb to Micro SD adapters", "blankets", "dvd players", "computers", "Modded Handhelds"]; //array

            document.write("<ul>");

            //loop through all the values in the array
            for( var counter = 0; counter < items.length; counter++)
            {
                document.write("<li>" + items[counter] + "</li>");
            }

            document.write("</ul>");
        </script>
    </body>
</html>
