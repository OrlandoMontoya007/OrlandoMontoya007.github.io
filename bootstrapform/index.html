<!DOCTYPE html>
<html>

    <head>
        <title>Bootstrap 5 Example</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="code.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <form>
                <div class="formgroup">
                    <label for="email">Email Address: <span id="emailerror"></span></label>
                    <input type="email" class="formcontrol" placeholder="Enter email" id="email" name="email">
                </div>
                <div class="formgroup">
                    <label for="confirm">Confirm Email: <span id="confirmerror"></span></label>
                    <input type="confirm" class="formcontrol" placeholder="Confirm" id="confirm" name="confirm">
                </div>

                <input type="button" value="Confirm Email" onclick="checkemail()">
            </form>
            <hr>
            <!---pizza form-->
            <h1>Pizza Hut Order Form</h1>
            
            <form>
                <div class="formcheck">
                    <label class="formchecklabel" for="small">
                        <input type="radio" class="formcheckinput" id="small" name="sizing" value="small" checked>Small
                    </label>
                </div>
            
                <div class="formcheck">
                    <label class="formchecklabel" for="medium">
                        <input type="radio" class="formcheckinput" id="medium" name="sizing" value="medium">Medium
                    </label>
                </div>

                <div class="formcheck">
                    <label class="formchecklabel" for="large">
                        <input type="radio" class="formcheckinput" id="large" name="sizing" value="large">Large
                    </label>
                </div>
                <!--toppings-->
                <hr>
                <div class="formcheck">
                    <label class="formchecklabel" for="pepperoni">
                        <input type="checkbox" class="formcheckinput" id="pepperoni" name="topping" value="pepperoni">Pepperoni
                    </label>
                </div>

                <div class="formcheck">
                    <label class="formchecklabel" for="sausage">
                        <input type="checkbox" class="formcheckinput" id="sausage" name="topping" value="sausage">Sausage
                    </label>
                </div>

                <div class="formcheck">
                    <label class="formchecklabel" for="mushrooms">
                        <input type="checkbox" class="formcheckinput" id="mushrooms" name="topping" value="mushrooms">Mushrooms
                    </label>
                </div>
                <hr>
                <input type="button" value="Confirm Order" onclick="pizzaorder()">
                <div id="output"></div>
            </form>
            <img id="cheese" src="Images/cheese.png">
            <img id="pepperoniimg" src="Images/pepperoni.png">
            <img id="sausageimg" src="Images/sausage.png">
            <img id="mushroomsimg" src="Images/mushrooms.png">
        </div>

        <script>
            document.getElementById("pepperoni").onclick = function(){
                if (this.checked == true)
               {
                document.getElementById("pepperoniimg").style = "display:block;";
              }
              else{
                document.getElementById("pepperoniimg").style = "display:none;";                
              }
            }

            document.getElementById("sausage").onclick = function(){
                if (this.checked == true)
               {
                document.getElementById("sausageimg").style = "display:block;";
              }
              else{
                document.getElementById("sausageimg").style = "display:none;";                
              }
            }

            document.getElementById("mushrooms").onclick = function(){
                if (this.checked == true)
               {
                document.getElementById("mushroomsimg").style = "display:block;";
              }
              else{
                document.getElementById("mushroomsimg").style = "display:none;";                
              }
            }
        </script>
    </body>
</html>
